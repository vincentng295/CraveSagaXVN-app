name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần đủ lịch sử để đếm commit làm versionCode

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest đã cài sẵn Android SDK (ANDROID_HOME), chỉ cần chấp nhận license.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ghi MV2R_KEYSTORE.env từ secret
        env:
          MV2R_KEYSTORE_ENV: ${{ secrets.MV2R_KEYSTORE_ENV }}
        run: |
          if [ -n "$MV2R_KEYSTORE_ENV" ]; then
            printf '%s\n' "$MV2R_KEYSTORE_ENV" > MV2R_KEYSTORE.env
            echo "Đã ghi MV2R_KEYSTORE.env từ secret MV2R_KEYSTORE_ENV."
          else
            echo "Không có secret MV2R_KEYSTORE_ENV -> build ký bằng khóa debug."
          fi

      - name: Tính phiên bản
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk CraveSagaX_VN.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraveSagaX_VN-apk
          path: CraveSagaX_VN.apk

      - name: Remove old 'apk-latest' release (nếu có)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete apk-latest --yes --cleanup-tag || echo "Chưa có release 'apk-latest', bỏ qua."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          prerelease: true
          body: |
            Build từ commit ${{ env.SHORT_SHA }}
          files: CraveSagaX_VN.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}